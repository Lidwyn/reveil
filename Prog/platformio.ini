; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:ATmega328P]
platform = atmelavr
board = ATmega328P
framework = arduino

lib_deps = 
    paulstoffregen/AltSoftSerial

; Internal 8 MHz clock
board_build.core = MiniCore
board_build.variant = standard  ; MiniCore handle 328P/328PA through "standard"
board_build.f_cpu = 8000000L
board_build.bootloader = yes
board_build.clock = internal


; Same option as Minicore in Arduino IDE
build_flags =
    -DARDUINO_MINICORE
    -DLTO_ENABLE              ; Enable LTO

; Upload parameters (MiniCore bootloader on UART0)
upload_flags =
    -V
upload_port = /dev/ttyUSB0
upload_speed = 38400
monitor_speed = 9600

